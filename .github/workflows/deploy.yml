# Tests, then a dry-run build on pull requests.
# On main, the same tests, then wrangler deploy of the existing Worker `clanksmith`.
# Secrets stay in GitHub Actions. This file does not print them.
name: Deploy clanksmith.com

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-clanksmith-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    name: Test and package the clanksmith Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Relay and site tests
        run: |
          node relay/test/all.mjs
          node --test site/request.test.mjs site/src/route.test.mjs
      - name: Dry-run build
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --config site/wrangler.jsonc
      - name: Deploy Worker clanksmith
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config site/wrangler.jsonc
