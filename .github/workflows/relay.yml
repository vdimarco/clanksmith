# Clanksmith relay checks. Mocked market only. No token and no payment.
name: clanksmith-relay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    name: Relay MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node relay/test/all.mjs
