# Clanksmith Agent Market checks. Mocked flow, plus two read-only GETs. No key and no payment.
name: agent-market

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market:
    name: Market hire flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mocked flow
        run: node market/test/all.mjs
      - name: read-only public calls
        run: node market/test/live.mjs
